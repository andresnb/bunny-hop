<style>
/* Layout: one screen. Slim header, the stone matrix fills the middle, three thumb buttons at the bottom.
   Look: strictly black and white, ink on night. White stones with black spirals float on a black void. */
:root {
  --ink: #000;
  --paper: #fff;
  --dim: #a6a6a6;
  --rule: #4a4a4a;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --mono: "Space Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
  box-sizing: border-box;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--paper);
  font-family: var(--display);
  font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
h1 {
  margin: 0;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 0.01em;
  line-height: 1;
}
.tools { display: flex; gap: 8px; }
.levels {
  display: flex;
  align-items: center;
  gap: 2px;
}
.level-name {
  font-family: var(--mono);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  min-width: 8ch;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.hud {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  border-top: 1px solid var(--rule);
  padding-top: 8px;
}
.stats {
  display: flex;
  gap: 12px;
  font-family: var(--mono);
  text-transform: uppercase;
  font-variant-numeric: tabular-nums;
}
.stats div { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.stats span { font-size: 10px; letter-spacing: 0.08em; color: var(--dim); line-height: 1; }
.stats b { font-size: 16px; font-weight: 700; line-height: 1; }
.stage {
  position: relative;
  flex: 1;
  min-height: 0;
}
canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}
.tip {
  margin: 0;
  min-height: 2.6em;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.3;
  text-align: center;
  color: var(--dim);
  text-wrap: balance;
}
.actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
button {
  font: inherit;
  font-weight: 500;
  color: var(--paper);
  background: var(--ink);
  border: 2px solid var(--paper);
  border-radius: 14px;
  min-height: 48px;
  padding: 0 12px;
  cursor: pointer;
  touch-action: manipulation;
}
button:active:not(:disabled) { background: var(--paper); color: var(--ink); }
button:disabled { border-color: var(--rule); color: var(--rule); cursor: default; }
button:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
.icon {
  position: relative;
  flex: none;
  min-height: 40px;
  width: 40px;
  padding: 0;
  border-radius: 50%;
  font-size: 20px;
  line-height: 1;
}
.icon[aria-pressed="false"] { color: var(--dim); border-color: var(--dim); }
.icon[aria-pressed="false"]::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 26px;
  height: 2px;
  background: currentColor;
  transform: translate(-50%, -50%) rotate(-45deg);
}
.solid { background: var(--paper); color: var(--ink); font-weight: 700; }
.solid:active:not(:disabled) { background: var(--ink); color: var(--paper); }
.sheet {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.72);
  padding: 12px;
}
.card {
  width: min(100%, 340px);
  max-height: 100%;
  overflow: auto;
  background: var(--ink);
  border: 2px solid var(--paper);
  border-radius: 20px;
  padding: 22px 20px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  text-align: center;
}
.card h2 { margin: 0; font-size: 28px; font-weight: 700; line-height: 1.05; text-wrap: balance; }
.card p { margin: 0; font-size: 15px; font-weight: 500; line-height: 1.4; color: var(--dim); }
.card ul {
  margin: 0;
  padding: 0 0 0 1.1em;
  text-align: left;
  font-size: 15px;
  font-weight: 500;
  line-height: 1.4;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.card .row { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
</style>

<body><!--wrap-->
<div class="app">
  <header class="top">
    <h1>Bunny Hop</h1>
    <div class="tools">
      <button class="icon" id="sound" aria-label="Música y sonidos" aria-pressed="true">&#9834;</button>
      <button class="icon" id="help" aria-label="Cómo se juega">?</button>
    </div>
  </header>
  <div class="hud">
    <div class="levels">
      <button class="icon" id="prev" aria-label="Nivel anterior">&#8249;</button>
      <span class="level-name" id="levelName">Nivel 1</span>
      <button class="icon" id="next" aria-label="Nivel siguiente">&#8250;</button>
    </div>
    <div class="stats">
      <div><span>Saltos</span><b id="moves">0</b></div>
      <div><span>Mínimo</span><b id="min">0</b></div>
      <div><span>Mejor</span><b id="best">–</b></div>
    </div>
  </div>
  <div class="stage" id="stage">
    <canvas id="board" aria-label="Tablero de piedras"></canvas>
    <div class="sheet" id="sheet" hidden>
      <div class="card" id="card" role="dialog" aria-modal="true"></div>
    </div>
  </div>
  <p class="tip" id="tip" aria-live="polite"></p>
  <div class="actions">
    <button id="undo">Deshacer</button>
    <button id="reset">Reiniciar</button>
    <button id="hint">Pista</button>
  </div>
</div>
<script>
(function () {
'use strict';

/*LOGIC-START*/
// ---------- Rules and level generation (no DOM in this block) ----------
// A position is three stones: bunny, pig, panda. "No pig" and "no panda" are both written as
// w * h, one past the last stone.

function rng32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// Stones next to stone i (up, right, down, left). Holes are not stones.
function neighbors(lv, i) {
  var W = lv.w, H = lv.h, x = i % W, y = (i - x) / W, out = [];
  if (y > 0 && lv.cells[i - W]) out.push(i - W);
  if (x < W - 1 && lv.cells[i + 1]) out.push(i + 1);
  if (y < H - 1 && lv.cells[i + W]) out.push(i + W);
  if (x > 0 && lv.cells[i - 1]) out.push(i - 1);
  return out;
}

// The pig hops one stone toward the bunny: sideways first, otherwise up or down.
// If the stone it wants is a hole, it stays put.
function pigStep(lv, pig, bun) {
  var W = lv.w, px = pig % W, py = (pig - px) / W, bx = bun % W, by = (bun - bx) / W;
  var dx = bx > px ? 1 : bx < px ? -1 : 0, dy = by > py ? 1 : by < py ? -1 : 0;
  if (dx && lv.cells[pig + dx]) return pig + dx;
  if (dy && lv.cells[pig + dy * W]) return pig + dy * W;
  return pig;
}

// The panda is smarter: it hops one stone along the shortest way around the holes to the pig.
function pandaStep(lv, pan, pig) {
  var d = lv.dist[pig], ns = neighbors(lv, pan), best = pan, bd = d[pan];
  for (var k = 0; k < ns.length; k++) if (d[ns[k]] < bd) { bd = d[ns[k]]; best = ns[k]; }
  return best;
}

// Everything that happens after the bunny hops to "to". The game animates this result and the
// solver searches with it, so both always agree on the rules.
//   pigDied: 1 the pig hopped onto the panda, 2 the panda caught it, 3 the panda landed on it.
function turn(lv, bun, pig, pan, to) {
  var N = lv.w * lv.h;
  var r = { pig: pig, pan: pan, lost: false, called: false, stuck: false, pigTo: -1, panTo: -1, pigDied: 0 };
  if (to === lv.exit) return r;
  if (to === lv.mega && pan === N && pig !== N) {
    r.called = true; r.pan = pan = lv.start;
    if (pig === pan) { r.pig = pig = N; r.pigDied = 3; }
  }
  if (pig !== N) {
    var p2 = pigStep(lv, pig, to);
    if (p2 === pig) r.stuck = true;
    else {
      r.pigTo = p2;
      if (p2 === pan) { r.pig = pig = N; r.pigDied = 1; }
      else if (p2 === to) { r.lost = true; r.pig = p2; return r; }
      else r.pig = pig = p2;
    }
  }
  if (pig !== N && pan !== N) {
    var q = pandaStep(lv, pan, pig);
    if (q !== pan) { r.panTo = q; r.pan = pan = q; }
    if (pan === pig) { r.pig = N; r.pigDied = 2; }
  }
  return r;
}

// Shortest escape from a position, as the list of stones the bunny hops to. null if there is none.
// With mustCall, only escapes that call the panda first count.
function solve(lv, bun, pig, pan, mustCall) {
  var N = lv.w * lv.h, M = N + 1;
  if (pan === undefined || pig === N) pan = N;
  var start = (bun * M + pig) * M + pan;
  var prev = new Int32Array(N * M * M).fill(-2), q = [start], head = 0;
  prev[start] = -1;
  while (head < q.length) {
    var s = q[head++], a = s % M, rest = (s - a) / M, p = rest % M, b = (rest - p) / M, ns = neighbors(lv, b);
    for (var k = 0; k < ns.length; k++) {
      var n = ns[k];
      if (n === p) continue;
      if (n === lv.exit) {
        if (mustCall && a === N && p !== N) continue;
        var path = [n], c = s;
        while (c !== start) { path.push(Math.floor(c / (M * M))); c = prev[c]; }
        return path.reverse();
      }
      var r = turn(lv, b, p, a, n);
      if (r.lost) continue;
      var t = (n * M + r.pig) * M + (r.pig === N ? N : r.pan);
      if (prev[t] !== -2) continue;
      prev[t] = s; q.push(t);
    }
  }
  return null;
}

// Hop distance from one stone to every other with nobody in the way. -1 if unreachable.
function distances(lv, from) {
  var d = new Int16Array(lv.w * lv.h).fill(-1), q = [from], head = 0;
  d[from] = 0;
  while (head < q.length) {
    var c = q[head++], ns = neighbors(lv, c);
    for (var k = 0; k < ns.length; k++) if (d[ns[k]] < 0) { d[ns[k]] = d[c] + 1; q.push(ns[k]); }
  }
  return d;
}

// How big and how tricky level n is. "detour" is how many extra hops the pig forces.
function specFor(n) {
  if (n <= 2) return { w: 4, h: 5, lo: 0, hi: 0, holes: 0.14 };
  if (n <= 5) return { w: 5, h: 6, lo: 2, hi: 2, holes: 0.2 };
  if (n <= 9) return { w: 5, h: 7, lo: 4, hi: 4, holes: 0.22 };
  if (n <= 14) return { w: 6, h: 7, lo: 6, hi: 6, holes: 0.24 };
  if (n <= 20) return { w: 6, h: 8, lo: 8, hi: 10, holes: 0.25 };
  return { w: 6, h: 8, lo: 10, hi: 99, holes: 0.26 };
}

function candidate(n, spec, seed) {
  var r = rng32(seed), W = spec.w, H = spec.h, N = W * H, i;
  var lv = { n: n, w: W, h: H, cells: new Uint8Array(N), start: 0, exit: 0, pig: 0, mega: -1, min: 0 };
  for (i = 0; i < N; i++) lv.cells[i] = r() < spec.holes ? 0 : 1;
  var bottoms = [], tops = [];
  for (i = 0; i < W; i++) {
    if (lv.cells[i]) tops.push(i);
    if (lv.cells[N - W + i]) bottoms.push(N - W + i);
  }
  if (!tops.length || !bottoms.length) return null;
  lv.start = bottoms[(r() * bottoms.length) | 0];
  lv.exit = tops[(r() * tops.length) | 0];
  var d = distances(lv, lv.start), count = 0, pigs = [];
  for (i = 0; i < N; i++) {
    if (d[i] < 0) { lv.cells[i] = 0; continue; }
    count++;
    if (i < 2 * W && i !== lv.exit) pigs.push(i);
  }
  if (d[lv.exit] < 0 || !pigs.length || count < N * 0.6) return null;
  lv.pig = pigs[(r() * pigs.length) | 0];
  var path = solve(lv, lv.start, lv.pig);
  if (!path) return null;
  lv.min = lv.direct = path.length;
  lv.path = path;
  lv.detour = path.length - d[lv.exit];
  return lv;
}

// Puts the panda megaphone on a stone where calling the panda is a real second way out:
// off the direct escape, reachable alive, and about as long as slipping past the pig.
function addMega(lv, r) {
  var N = lv.w * lv.h, i, cands = [], best = -1, bestLen = 0, bestGap = 1e9;
  lv.dist = [];
  for (i = 0; i < N; i++) lv.dist.push(lv.cells[i] ? distances(lv, i) : null);
  var d0 = lv.dist[lv.start];
  for (i = 0; i < N; i++) {
    if (lv.cells[i] && i !== lv.start && i !== lv.exit && i !== lv.pig && d0[i] >= 3 && lv.path.indexOf(i) < 0) cands.push(i);
  }
  for (i = cands.length - 1; i > 0; i--) {
    var j = (r() * (i + 1)) | 0, tmp = cands[i]; cands[i] = cands[j]; cands[j] = tmp;
  }
  for (i = 0; i < cands.length && i < 10; i++) {
    lv.mega = cands[i];
    var path = solve(lv, lv.start, lv.pig, N, true);
    if (!path) continue;
    var gap = Math.abs(path.length - lv.direct);
    if (gap < bestGap) { bestGap = gap; best = cands[i]; bestLen = path.length; }
  }
  lv.mega = best;
  if (best < 0) return false;
  lv.via = bestLen;
  lv.min = Math.min(lv.direct, bestLen);
  return true;
}

// Level n is always the same board: the first candidate that fits the level's spec.
// From level 10 on, every board also carries a megaphone.
function makeLevel(n) {
  var spec = specFor(n), fallback = null;
  for (var a = 0; a < 6000; a++) {
    var lv = candidate(n, spec, n * 7919 + a * 104729);
    if (!lv) continue;
    if (lv.detour >= spec.lo && lv.detour <= spec.hi) {
      if (n < 10 || addMega(lv, rng32(n * 31337 + a))) return lv;
      continue;
    }
    if (!fallback || Math.abs(lv.detour - spec.lo) < Math.abs(fallback.detour - spec.lo)) fallback = lv;
  }
  if (fallback && n >= 10) addMega(fallback, rng32(n * 31337));
  return fallback;
}
/*LOGIC-END*/

// ---------- Game state ----------

var $ = function (id) { return document.getElementById(id); };
var canvas = $('board'), ctx = canvas.getContext('2d'), stage = $('stage');
var sheet = $('sheet'), card = $('card'), tip = $('tip');
var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var KEY = 'bunnyhop.v1';

var store = { max: 1, cur: 1, best: {}, sound: true };
try {
  var raw = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (raw && raw.max >= 1) store = { max: raw.max | 0, cur: raw.cur | 0 || 1, best: raw.best || {}, sound: raw.sound !== false };
} catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

var cache = {};
function level(n) { return cache[n] || (cache[n] = makeLevel(n)); }

var G = { n: 1, lv: null, bun: 0, pig: 0, pan: 0, moves: 0, hist: [], status: 'play', hint: -1, callT: 0 };
var A = {
  bun: { x: 0, y: 0, lift: 0, show: true, face: 1, land: 0 },
  pig: { x: 0, y: 0, lift: 0, face: -1, land: 0, shake: 0, die: 0 },
  pan: { x: 0, y: 0, lift: 0, show: false, face: 1, land: 0 }
};
var shapes = [], busy = false;

function colOf(i) { return i % G.lv.w; }
function rowOf(i) { return (i - i % G.lv.w) / G.lv.w; }

function place() {
  var N = G.lv.w * G.lv.h;
  tweens.length = 0; busy = false;
  A.bun.x = colOf(G.bun); A.bun.y = rowOf(G.bun); A.bun.lift = 0; A.bun.show = true;
  A.pig.lift = 0; A.pig.shake = 0; A.pig.die = G.pig === N ? 1 : 0;
  if (G.pig !== N) { A.pig.x = colOf(G.pig); A.pig.y = rowOf(G.pig); }
  A.pan.show = G.pan !== N; A.pan.lift = 0;
  if (A.pan.show) { A.pan.x = colOf(G.pan); A.pan.y = rowOf(G.pan); }
  A.bun.land = A.pig.land = A.pan.land = 0; G.callT = 0;
  if (G.pig !== N && A.pig.x !== A.bun.x) { A.pig.face = A.bun.x > A.pig.x ? 1 : -1; A.bun.face = -A.pig.face; }

}

function loadLevel(n, saved) {
  G.n = n; G.lv = level(n);
  var nobody = G.lv.w * G.lv.h;
  G.bun = G.lv.start; G.pig = G.lv.pig; G.pan = nobody; G.moves = 0; G.hist = []; G.status = 'play'; G.hint = -1;
  var ok = function (c) { return c === nobody || !!G.lv.cells[c]; };
  if (saved && saved.n === n && G.lv.cells[saved.bun] && ok(saved.pig) && ok(saved.pan)) {
    G.bun = saved.bun; G.pig = saved.pig; G.pan = saved.pan; G.moves = saved.moves | 0; G.hist = saved.hist || [];
  }
  var r = rng32(n * 2654435761), N = G.lv.w * G.lv.h;
  shapes = [];
  for (var i = 0; i < N; i++) {
    var rad = [];
    for (var j = 0; j < 9; j++) rad.push(0.93 + r() * 0.14);
    shapes.push({ rad: rad, rot: r() * 6.283, spin: r() * 6.283, dir: r() < 0.5 ? -1 : 1, turns: 2.3 + r() * 0.7 });
  }
  store.cur = n; save();
  sheet.hidden = true;
  place(); layout(); hud();
  say(n === 1 ? 'Toca una piedra vecina o desliza para saltar. Llega a la piedra negra.'
    : n === 3 ? 'Ahora el camino corto no alcanza. Deja al chanchito atascado detrás de un hueco.'
    : n === 10 ? 'Nuevo: salta al megáfono y vendrá un panda a aplastar al chanchito. O escapa directo, tú eliges.'
    : '');
  draw();
}

function say(text) { tip.textContent = text; }

function hud() {
  $('levelName').textContent = 'Nivel ' + G.n;
  $('moves').textContent = G.moves;
  $('min').textContent = G.lv.min;
  $('best').textContent = store.best[G.n] || '–';
  $('prev').disabled = G.n <= 1;
  $('next').disabled = G.n >= store.max;
  $('undo').disabled = !G.hist.length;
}

// ---------- Turns ----------

// The "nobody" marker for the pig and the panda, same as in the rules.
function none() { return G.lv.w * G.lv.h; }

function tryMove(to) {
  if (G.status !== 'play' || busy) return;
  if (to === G.pig || neighbors(G.lv, G.bun).indexOf(to) < 0) return;
  var r = turn(G.lv, G.bun, G.pig, G.pan, to);
  G.hist.push([G.bun, G.pig, G.pan]);
  G.bun = to; G.moves++; G.hint = -1; busy = true;
  say(''); hud(); sfx('hop');
  hop(A.bun, colOf(to), rowOf(to), 190, function () {
    if (to === G.lv.exit) return win();
    callPanda(r);
  });
}

function callPanda(r) {
  if (!r.called) return pigMove(r);
  var s = G.lv.start;
  G.pan = s; G.callT = performance.now(); sfx('call');
  say('¡El megáfono llamó al panda! Aguanta mientras llega.');
  A.pan.show = true; A.pan.x = colOf(s); A.pan.y = G.lv.h + 0.9; A.pan.land = 0;
  hop(A.pan, colOf(s), rowOf(s), 360, function () {
    if (r.pigDied === 3) squash();
    pigMove(r);
  });
}

function pigMove(r) {
  if (r.stuck) {
    A.pig.shake = performance.now(); kick(320); sfx('stuck');
    if (G.pan === none()) say('El chanchito se quedó atascado.');
  }
  if (r.pigTo < 0) return pandaMove(r);
  sfx('pig');
  hop(A.pig, colOf(r.pigTo), rowOf(r.pigTo), 190, function () {
    if (r.lost) { G.pig = r.pigTo; return lose('Cayó en tu piedra.'); }
    if (r.pigDied === 1) squash(); else G.pig = r.pigTo;
    pandaMove(r);
  });
}

function pandaMove(r) {
  if (r.panTo < 0) return endTurn();
  sfx('panda');
  hop(A.pan, colOf(r.panTo), rowOf(r.panTo), 190, function () {
    G.pan = r.panTo;
    if (r.pigDied === 2) squash();
    endTurn();
  });
}

function squash() {
  G.pig = none(); A.pig.die = performance.now(); kick(480); sfx('squash');
  say('¡El panda aplastó al chanchito! Camino libre.');
}

function endTurn() {
  if (G.pig !== none() && G.pan === none()) {
    var free = neighbors(G.lv, G.bun).filter(function (n) { return n !== G.pig; });
    if (!free.length) {
      G.pig = G.bun; sfx('pig');
      return hop(A.pig, colOf(G.bun), rowOf(G.bun), 190, function () { lose('Te acorraló sin salida.'); });
    }
  }
  busy = false; draw();
}

function win() {
  G.status = 'won';
  var perfect = G.moves <= G.lv.min, old = store.best[G.n];
  if (!old || G.moves < old) store.best[G.n] = G.moves;
  if (store.max < G.n + 1) store.max = G.n + 1;
  save(); hud(); sfx('win');
  hop(A.bun, colOf(G.bun), -1.6, 300, function () {
    A.bun.show = false; busy = false; draw();
    show(perfect ? '¡Ruta perfecta!' : '¡Escapaste!',
      perfect ? 'Saliste en ' + G.moves + ' saltos, el mínimo posible.'
        : 'Saliste en ' + G.moves + ' saltos. El mínimo es ' + G.lv.min + '.',
      perfect ? [['Siguiente nivel', function () { loadLevel(G.n + 1); }, true]]
        : [['Siguiente nivel', function () { loadLevel(G.n + 1); }, true], ['Buscar el mínimo', function () { loadLevel(G.n); }]]);
  });
}

function lose(why) {
  G.status = 'lost'; A.bun.show = false; busy = false; hud(); draw(); sfx('lose');
  show('¡Te atrapó!', why + ' Deshaz el último salto o empieza de nuevo.',
    [['Deshacer', undo, true], ['Reiniciar nivel', function () { loadLevel(G.n); }]]);
}

function undo() {
  if (busy || !G.hist.length) return;
  var h = G.hist.pop();
  G.bun = h[0]; G.pig = h[1]; G.pan = h[2] === undefined ? none() : h[2];
  G.moves--; G.status = 'play'; G.hint = -1;
  sheet.hidden = true; say('');
  place(); hud(); draw();
}

function hint() {
  if (G.status !== 'play' || busy) return;
  var path = solve(G.lv, G.bun, G.pig, G.pan);
  if (!path) { say('Desde aquí ya no hay salida. Deshaz un salto o reinicia.'); return; }
  G.hint = path[0];
  say('Salta a la piedra marcada.');
  kick();
}

function showHelp() {

// ---------- Animation ----------

var tweens = [], raf = 0, activeUntil = 0;

function kick(ms) {
  activeUntil = Math.max(activeUntil, performance.now() + (ms || 0));
  if (!raf) raf = requestAnimationFrame(frame);
}

// Runs all the time (the characters breathe and blink), except with reduced motion.
function frame(now) {
  raf = 0;
  for (var i = tweens.length - 1; i >= 0; i--) {
    var tw = tweens[i], t = Math.max(0, Math.min(1, (now - tw.t0) / tw.dur));
    tw.step(t);
    if (t >= 1) { tweens.splice(i, 1); if (tw.done) tw.done(); }
  }
  draw(now);
  if (tweens.length || now < activeUntil || !reduced) raf = requestAnimationFrame(frame);
}

function hop(actor, toX, toY, dur, done) {
  var fx = actor.x, fy = actor.y;
  if (toX !== fx) actor.face = toX > fx ? 1 : -1;
  if (reduced) { actor.x = toX; actor.y = toY; actor.lift = 0; draw(); if (done) done(); return; }
  tweens.push({
    t0: performance.now(), dur: dur,
    step: function (t) {
      actor.x = fx + (toX - fx) * t; actor.y = fy + (toY - fy) * t; actor.lift = Math.sin(Math.PI * t);
    },
    done: function () { actor.lift = 0; actor.land = performance.now(); if (done) done(); }
  });
  kick();
}

// ---------- Sound ----------
// An original 8-bit loop: square lead, bouncing triangle bass, a soft kick and hat.

var AC = window.AudioContext || window.webkitAudioContext;
var ac = null, out = null, noise = null, songTimer = 0, nextT = 0, stepI = 0, STEP = 60 / 150 / 2;

var SONG = [
  ['C3', 'G5 - E5 G5 C6 - G5 E5'],
  ['A2', 'A5 - E5 A5 C6 - B5 A5'],
  ['F2', 'A5 - F5 A5 C6 - A5 F5'],
  ['G2', 'B5 - G5 B5 D6 - - -'],
  ['C3', 'E6 - C6 E6 G6 - E6 C6'],
  ['A2', 'C6 - A5 C6 E6 - D6 C6'],
  ['F2', 'A5 C6 F6 - E6 - D6 -'],
  ['G2', 'G5 B5 D6 - G6 - - -'],
  ['F2', 'F5 A5 C6 A5 F5 A5 C6 -'],
  ['C3', 'E5 G5 C6 G5 E5 G5 C6 -'],
  ['F2', 'A5 - A5 G5 F5 - A5 -'],
  ['G2', 'G5 - B5 - D6 - B5 -'],
  ['F2', 'C6 - A5 - F5 - A5 C6'],
  ['C3', 'E6 - C6 - G5 - C6 E6'],
  ['D3', 'F6 E6 D6 - A5 - D6 -'],
  ['G2', 'G5 A5 B5 D6 G6 - - -']

function hz(name) {
  var semi = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[name.charAt(0)];
  return 440 * Math.pow(2, (12 * (+name.charAt(1) + 1) + semi - 69) / 12);
}

var SEQ = [];
SONG.forEach(function (bar) {
  var root = hz(bar[0]), notes = bar[1].split(' ');
  notes.forEach(function (nm, i) {
    var len = 1;
    if (nm !== '-') while (i + len < notes.length && notes[i + len] === '-') len++;
    SEQ.push({ lead: nm === '-' ? 0 : hz(nm), len: len, bass: i % 2 ? root * 2 : root, beat: i });
  });
});

function blip(type, f, t, dur, vol, to) {
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.02);
}

function hiss(t, dur, vol) {
  var s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = 'highpass'; f.frequency.value = 6000; s.buffer = noise;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t + dur + 0.02);
}

function pump() {
  if (!ac || ac.state !== 'running') return;
  if (nextT < ac.currentTime) nextT = ac.currentTime + 0.05;
  while (nextT < ac.currentTime + 0.2) {
    var s = SEQ[stepI];
    if (s.lead) blip('square', s.lead, nextT, STEP * s.len * 0.92, 0.04);
    blip('triangle', s.bass, nextT, STEP * 0.85, 0.16);
    if (s.beat % 4 === 0) blip('sine', 130, nextT, 0.11, 0.2, 45);
    if (s.beat % 2 === 1) hiss(nextT, 0.04, 0.05);
    nextT += STEP; stepI = (stepI + 1) % SEQ.length;

}

// Browsers only let sound start from a tap or a key, so this is called from those.
function audioOn() {
  if (!AC || !store.sound || document.hidden) return;
  try {
    if (!ac) {
      ac = new AC(); out = ac.createGain(); out.gain.value = 0.5; out.connect(ac.destination);
      noise = ac.createBuffer(1, (ac.sampleRate * 0.2) | 0, ac.sampleRate);
      var d = noise.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state !== 'running') ac.resume();
    if (!songTimer) { nextT = ac.currentTime + 0.08; songTimer = setInterval(pump, 40); }
  } catch (e) {}
}

function audioOff() {
  if (songTimer) { clearInterval(songTimer); songTimer = 0; }
  try { if (ac && ac.state === 'running') ac.suspend(); } catch (e) {}
}

function sfx(kind) {
  if (!ac || ac.state !== 'running' || !store.sound) return;
  var t = ac.currentTime + 0.01;
  if (kind === 'hop') blip('square', 620, t, 0.09, 0.05, 1100);
  else if (kind === 'pig') { blip('square', 170, t, 0.07, 0.08, 120); blip('square', 200, t + 0.07, 0.07, 0.07, 130); }
  else if (kind === 'stuck') blip('sawtooth', 95, t, 0.16, 0.07, 80);
  else if (kind === 'win') [523, 659, 784, 1047, 1319].forEach(function (f, i) { blip('square', f, t + i * 0.08, 0.16, 0.07); });
  else if (kind === 'lose') [494, 392, 330, 196].forEach(function (f, i) { blip('square', f, t + i * 0.13, 0.2, 0.07); });
  else if (kind === 'call') [784, 784, 988, 1175].forEach(function (f, i) { blip('sawtooth', f, t + i * 0.09, i === 3 ? 0.3 : 0.08, 0.06); });
  else if (kind === 'panda') blip('triangle', 260, t, 0.1, 0.2, 340);
  else if (kind === 'squash') { blip('square', 330, t, 0.28, 0.09, 45); hiss(t, 0.14, 0.14); }
}

function soundButton() { $('sound').setAttribute('aria-pressed', store.sound ? 'true' : 'false'); }

// ---------- Drawing ----------

var cell = 40, ox = 0, oy = 0, vw = 0, vh = 0;
var layer = document.createElement('canvas'), lc = layer.getContext('2d');

function layout() {
  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  vw = stage.clientWidth; vh = stage.clientHeight;
  if (!vw || !vh || !G.lv) return;
  var w = Math.round(vw * dpr), h = Math.round(vh * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  if (layer.width !== w || layer.height !== h) { layer.width = w; layer.height = h; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  lc.setTransform(dpr, 0, 0, dpr, 0, 0);
  cell = Math.min(vw / (G.lv.w + 0.2), vh / (G.lv.h + 1.5), 104);
  ox = (vw - cell * G.lv.w) / 2;
  oy = (vh - cell * G.lv.h) / 2;
  paintBoard();
}
function px(x) { return ox + (x + 0.5) * cell; }
function py(y) { return oy + (y + 0.5) * cell; }

function blob(c, x, y, R, sh) {
  var k = sh.rad.length, pts = [], j;
  for (j = 0; j < k; j++) {
    var a = sh.rot + j / k * 6.2832, rr = R * sh.rad[j];
    pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]);
  }
  c.beginPath();
  c.moveTo((pts[k - 1][0] + pts[0][0]) / 2, (pts[k - 1][1] + pts[0][1]) / 2);
  for (j = 0; j < k; j++) {
    var n = pts[(j + 1) % k];
    c.quadraticCurveTo(pts[j][0], pts[j][1], (pts[j][0] + n[0]) / 2, (pts[j][1] + n[1]) / 2);
  }
  c.closePath();
}

function spiral(c, x, y, R, sh) {
  c.beginPath();
  for (var s = 0; s <= 80; s++) {
    var t = s / 80, a = sh.spin + sh.dir * t * sh.turns * 6.2832, r = R * 0.66 * t;
    if (s) c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    else c.moveTo(x, y);
  }
  c.stroke();
}

function arrowUp(c, x, y, s) {
  c.beginPath();
  c.moveTo(x, y - s); c.lineTo(x + s * 0.8, y); c.lineTo(x - s * 0.8, y);
  c.closePath(); c.fill();
}

// The stones never move, so they are painted once per level and size onto their own layer.
function paintBoard() {
  if (!G.lv || !vw || !shapes.length) return;
  var c = lc, lv = G.lv, N = lv.w * lv.h, R = cell * 0.44, i, x, y;
  c.fillStyle = '#000'; c.fillRect(0, 0, vw, vh);
  c.lineCap = 'round'; c.lineJoin = 'round';
  for (i = 0; i < N; i++) {
    x = px(i % lv.w); y = py((i - i % lv.w) / lv.w);
    if (!lv.cells[i]) {
      c.fillStyle = '#4a4a4a';
      c.beginPath(); c.arc(x, y, Math.max(1.2, cell * 0.028), 0, 6.2832); c.fill();
      continue;
    }
    var exit = i === lv.exit;
    blob(c, x, y, R, shapes[i]);
    c.fillStyle = exit ? '#000' : '#fff'; c.fill();
    if (exit) { c.strokeStyle = '#fff'; c.lineWidth = cell * 0.05; c.stroke(); }
    c.strokeStyle = exit ? '#fff' : '#000'; c.lineWidth = cell * 0.052;
    spiral(c, x, y, R, shapes[i]);
  }
  // Way in and way out, marked outside the matrix.
  var fs = Math.max(10, Math.min(14, cell * 0.2));
  c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = '700 ' + fs + 'px "Space Mono", ui-monospace, monospace';
  x = px(lv.exit % lv.w);
  arrowUp(c, x, oy - cell * 0.42, cell * 0.11);
  c.fillText('SALIDA', x, oy - cell * 0.22);
  x = px(lv.start % lv.w);
  arrowUp(c, x, oy + cell * lv.h + cell * 0.2, cell * 0.11);
  c.fillText('ENTRADA', x, oy + cell * lv.h + cell * 0.42);
}

function oval(x, y, rx, ry, rot) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, 6.2832); ctx.fill(); ctx.stroke();
}
function dot(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); }
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

// Both characters are drawn around the middle of their stone, feet at +0.34 s, looking right.
// k.lift is 0..1 through the hop, k.flop is the wobble right after landing.
function drawBunny(s, k) {
  var up = k.lift, lw = s * 0.036, d, ex = s * 0.02, ey = -s * 0.085;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = lw;
  oval(-s * 0.175, s * 0.2, s * 0.055, s * 0.055);
  oval(-s * 0.075 - up * s * 0.05, s * 0.315 + up * s * 0.035, s * 0.08, s * 0.04, up * 0.6);
  oval(s * 0.1 - up * s * 0.03, s * 0.315 + up * s * 0.035, s * 0.08, s * 0.04, up * 0.6);
  oval(0, s * 0.185, s * 0.165, s * 0.14);
  for (d = -1; d <= 1; d += 2) oval(d * s * (0.075 + up * 0.075), s * 0.16 - up * s * 0.1, s * 0.03, s * 0.05, d * (0.25 + up * 1.2));
  for (d = -1; d <= 1; d += 2) {
    ctx.save(); ctx.translate(d * s * 0.09, -s * 0.2); ctx.rotate(d * (0.16 + up * 0.24 - k.flop * 1.7));
    ctx.lineWidth = lw; oval(0, -s * 0.14, s * 0.06, s * 0.16);
    ctx.lineWidth = s * 0.024; line(0, -s * 0.21, 0, -s * 0.08);
    ctx.restore();
  }
  ctx.lineWidth = lw;
  oval(0, -s * 0.075, s * 0.225, s * 0.185);

  ctx.fillStyle = '#000'; ctx.lineWidth = s * 0.024;
  if (k.blink) {
    line(ex - s * 0.125, ey, ex - s * 0.065, ey); line(ex + s * 0.065, ey, ex + s * 0.125, ey);
  } else if (k.scared) {
    dot(ex - s * 0.095, ey, s * 0.046); dot(ex + s * 0.095, ey, s * 0.046);
    ctx.fillStyle = '#fff';
    dot(ex - s * 0.085, ey - s * 0.014, s * 0.018); dot(ex + s * 0.105, ey - s * 0.014, s * 0.018);
    ctx.beginPath(); ctx.moveTo(-s * 0.2, -s * 0.24); ctx.quadraticCurveTo(-s * 0.26, -s * 0.15, -s * 0.215, -s * 0.135);
    ctx.quadraticCurveTo(-s * 0.17, -s * 0.15, -s * 0.2, -s * 0.24); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#000';
  } else {
    dot(ex - s * 0.095, ey, s * 0.032); dot(ex + s * 0.095, ey, s * 0.032);
  }
  ctx.beginPath(); ctx.ellipse(ex, -s * 0.03, s * 0.024, s * 0.017, 0, 0, 6.2832); ctx.fill();
  ctx.lineWidth = s * 0.02;
  ctx.beginPath();
  if (k.scared) {
    ctx.ellipse(ex, s * 0.035, s * 0.022, s * 0.026, 0, 0, 6.2832);
  } else {
    ctx.moveTo(ex - s * 0.045, s * 0.02); ctx.quadraticCurveTo(ex - s * 0.02, s * 0.05, ex, -s * 0.005);
    ctx.quadraticCurveTo(ex + s * 0.02, s * 0.05, ex + s * 0.045, s * 0.02);
  }
  ctx.stroke();
  ctx.lineWidth = s * 0.016;
  for (d = -1; d <= 1; d += 2) {
    line(ex + d * s * 0.15, -s * 0.03, ex + d * s * 0.135, s * 0.0);
    line(ex + d * s * 0.175, -s * 0.03, ex + d * s * 0.16, s * 0.0);
  }
}

function drawPig(s, k) {
  var up = k.lift, lw = s * 0.034, d, i, ex = s * 0.02, ey = -s * 0.135;
  // Curly tail, drawn twice so it shows on white stones and on the black void.
  for (d = 0; d < 2; d++) {
    ctx.strokeStyle = d ? '#000' : '#fff'; ctx.lineWidth = s * (d ? 0.034 : 0.07);
    ctx.beginPath(); ctx.moveTo(-s * 0.17, s * 0.16);
    for (i = 0; i <= 22; i++) {
      var t = i / 22, a = 1.2 + t * 8.2 + k.flop * 4, r = s * (0.058 - 0.036 * t);
      ctx.lineTo(-s * 0.25 + Math.cos(a) * r, s * 0.1 - up * s * 0.03 + Math.sin(a) * r);

    ctx.stroke();
  }
  ctx.fillStyle = '#000'; ctx.strokeStyle = '#fff'; ctx.lineWidth = lw;
  oval(-s * 0.095 - up * s * 0.04, s * 0.305 + up * s * 0.035, s * 0.055, s * 0.045);
  oval(s * 0.095 + up * s * 0.04, s * 0.305 + up * s * 0.035, s * 0.055, s * 0.045);
  oval(0, s * 0.175, s * 0.2, s * 0.15);
  for (d = -1; d <= 1; d += 2) {
    ctx.beginPath();
    ctx.moveTo(d * s * 0.06, -s * 0.26);
    ctx.lineTo(d * s * 0.275, -s * 0.36 - up * s * 0.05 - k.flop * s * 0.5);
    ctx.lineTo(d * s * 0.215, -s * 0.12);

  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(ex, -s * 0.03, s * 0.105, s * 0.072, 0, 0, 6.2832); ctx.fill();
  ctx.lineWidth = s * 0.028;
  if (k.blink) {
    line(ex - s * 0.13, ey, ex - s * 0.07, ey); line(ex + s * 0.07, ey, ex + s * 0.13, ey);

  line(ex + s * 0.17, s * b1, ex + s * 0.055, s * b2);
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(ex - s * 0.04, -s * 0.03, s * 0.019, s * 0.03, 0, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse(ex + s * 0.04, -s * 0.03, s * 0.019, s * 0.03, 0, 0, 6.2832); ctx.fill();
}

function drawPanda(s, k) {
  var up = k.lift, lw = s * 0.034, d, ex = s * 0.015, ey = -s * 0.1;
  // Black parts get a white edge so they still show over the black void.
  ctx.fillStyle = '#000'; ctx.strokeStyle = '#fff'; ctx.lineWidth = s * 0.022;
  oval(-s * 0.105 - up * s * 0.04, s * 0.3 + up * s * 0.035, s * 0.078, s * 0.052);
  oval(s * 0.105 + up * s * 0.04, s * 0.3 + up * s * 0.035, s * 0.078, s * 0.052);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = lw;
  oval(0, s * 0.17, s * 0.205, s * 0.16);
  ctx.fillStyle = '#000'; ctx.strokeStyle = '#fff'; ctx.lineWidth = s * 0.022;
  for (d = -1; d <= 1; d += 2) {
    oval(d * s * (0.175 + up * 0.05), s * 0.13 - up * s * 0.13, s * 0.046, s * 0.088, d * (0.3 + up * 1.3));
    oval(d * s * 0.165, -s * 0.255 - k.flop * s * 0.12, s * 0.068, s * 0.068);
  }
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = lw;
  oval(0, -s * 0.09, s * 0.235, s * 0.195);

  ctx.fillStyle = '#000';
  for (d = -1; d <= 1; d += 2) {
    ctx.beginPath(); ctx.ellipse(ex + d * s * 0.098, ey + s * 0.008, s * 0.056, s * 0.07, d * 0.5, 0, 6.2832); ctx.fill();
  }
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = s * 0.02;
  for (d = -1; d <= 1; d += 2) {
    if (k.blink) line(ex + d * s * 0.065, ey, ex + d * s * 0.115, ey);
    else dot(ex + d * s * 0.09, ey - s * 0.005, s * 0.022);
  }
  ctx.fillStyle = '#000'; ctx.strokeStyle = '#000';
  ctx.beginPath(); ctx.ellipse(ex, -s * 0.02, s * 0.03, s * 0.02, 0, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.moveTo(ex - s * 0.045, s * 0.02); ctx.quadraticCurveTo(ex, s * 0.065, ex + s * 0.045, s * 0.02); ctx.stroke();
}

// The megaphone with panda ears. It sits on its stone until the bunny lands there.
function drawMega(now) {
  var lv = G.lv, s = cell * 1.1, t = reduced ? 0.3 : now / 1000, i;
  ctx.save();
  ctx.translate(px(colOf(lv.mega)) - cell * 0.045, py(rowOf(lv.mega)) + cell * 0.02);
  ctx.fillStyle = '#fff'; dot(cell * 0.045, -cell * 0.02, cell * 0.4);
  ctx.rotate(-0.24 + (reduced ? 0 : Math.sin(t * 5) * 0.07));
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // Ears, mouthpiece and handle sit behind the cone.
  ctx.fillStyle = '#000';
  dot(-s * 0.125, -s * 0.15, s * 0.078); dot(s * 0.03, -s * 0.215, s * 0.078);
  ctx.fillRect(-s * 0.34, -s * 0.06, s * 0.09, s * 0.12);
  ctx.fillRect(-s * 0.13, s * 0.06, s * 0.075, s * 0.2);
  // Cone.
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = s * 0.036;
  ctx.beginPath();
  ctx.moveTo(-s * 0.27, -s * 0.055); ctx.lineTo(s * 0.15, -s * 0.2); ctx.lineTo(s * 0.15, s * 0.2); ctx.lineTo(-s * 0.27, s * 0.055);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // Flared bell with its dark opening.
  ctx.beginPath(); ctx.ellipse(s * 0.165, 0, s * 0.07, s * 0.245, 0, 0, 6.2832); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(s * 0.172, 0, s * 0.034, s * 0.165, 0, 0, 6.2832); ctx.fill();
  // Panda face on the side of the cone.
  ctx.beginPath(); ctx.ellipse(-s * 0.125, -s * 0.012, s * 0.036, s * 0.05, 0.45, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-s * 0.01, -s * 0.03, s * 0.04, s * 0.056, -0.45, 0, 6.2832); ctx.fill();
  dot(-s * 0.07, s * 0.055, s * 0.018);
  ctx.fillStyle = '#fff';
  dot(-s * 0.12, -s * 0.018, s * 0.014); dot(-s * 0.012, -s * 0.036, s * 0.015);
  // Sound coming out.
  ctx.lineWidth = s * 0.03;
  for (i = 0; i < 2; i++) {
    var ph = (t * 1.4 + i * 0.5) % 1;
    ctx.globalAlpha = 1 - ph;
    ctx.beginPath(); ctx.arc(s * 0.2, 0, s * (0.09 + 0.1 * ph), -0.8, 0.8); ctx.stroke();
  }
  ctx.restore();
}

// Squash and stretch from the feet: stretch in the air, squash and wobble on landing, breathe at rest.
// o.size scales the character, o.dx shifts it sideways, o.flat (0..1) presses it into the stone.
function render(a, fn, now, phase, o) {
  var u = a.land ? (now - a.land) / 340 : 2;
  var flop = u < 1 && !reduced ? -0.4 * Math.sin(6.2832 * u) * Math.exp(-3.5 * u) : 0;
  var st = 0.15 * a.lift + flop + (reduced ? 0 : 0.014 * Math.sin(now / 420 + phase));
  var size = cell * 1.12 * (o.size || 1), foot = size * 0.34, flat = o.flat || 0;
  ctx.save();
  ctx.translate(px(a.x) + (o.dx || 0) * cell, py(a.y) - cell * 0.03 - a.lift * cell * 0.36 + foot);
  ctx.scale(a.face * (1 - st * 0.55) * (1 + flat * 0.5), (1 + st) * (1 - flat * 0.88));
  ctx.translate(0, -foot);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  fn(size, { lift: a.lift, flop: flop, scared: o.scared, blink: !reduced && (now + phase * 900) % 3600 < 130 });
  ctx.restore();
}

function draw(now) {
  if (!G.lv || !vw) return;
  now = now || performance.now();
  var lv = G.lv, N = lv.w * lv.h, i;
  ctx.drawImage(layer, 0, 0, vw, vh);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  if (lv.mega >= 0 && G.pan === N && G.pig !== N) drawMega(now);

  // The megaphone's shout, rippling out from its stone.
  var shout = G.callT ? (now - G.callT) / 700 : 2;
  if (shout < 1 && lv.mega >= 0) {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(2, cell * 0.04);
    for (i = 0; i < 3; i++) {
      var ph = shout - i * 0.18;
      if (ph <= 0) continue;
      ctx.globalAlpha = Math.max(0, 1 - ph);
      ctx.beginPath(); ctx.arc(px(colOf(lv.mega)), py(rowOf(lv.mega)), cell * (0.45 + ph * 1.4), 0, 6.2832); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  if (G.hint >= 0 && G.status === 'play') {
    var pulse = reduced ? 0.5 : 0.5 + 0.5 * Math.sin(now / 180);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(2, cell * 0.045);
    ctx.setLineDash([cell * 0.12, cell * 0.1]);
    ctx.beginPath();
    ctx.arc(px(colOf(G.hint)), py(rowOf(G.hint)), cell * (0.5 + 0.035 * pulse), 0, 6.2832);
    ctx.stroke(); ctx.setLineDash([]);
  }

  var alive = G.pig !== N, panda = G.pan !== N && A.pan.show;
  var dying = A.pig.die ? (now - A.pig.die) / 420 : 2;
  var shake = 0, since = now - A.pig.shake;
  if (A.pig.shake && since < 320) shake = Math.sin(since / 320 * Math.PI * 6) * 0.05 * (1 - since / 320);
  var near = alive && G.status === 'play' &&
    Math.abs(colOf(G.bun) - colOf(G.pig)) + Math.abs(rowOf(G.bun) - rowOf(G.pig)) <= 1;
  // Friends sharing a stone stand side by side.
  var share = panda && A.bun.show && Math.abs(A.pan.x - A.bun.x) < 0.02 && Math.abs(A.pan.y - A.bun.y) < 0.02;

  var cast = [];
  if (alive || dying < 1) cast.push([A.pig, drawPig, 2.1, { dx: shake, scared: panda, flat: alive ? 0 : Math.min(1, dying * 2.2) }]);
  if (panda) cast.push([A.pan, drawPanda, 4.3, { size: 1.14, dx: share ? -0.15 : 0 }]);
  if (A.bun.show) cast.push([A.bun, drawBunny, 0, { scared: near, dx: share ? 0.2 : 0 }]);
  // Whoever stands lower on the screen is drawn last, so ears never cover a face.
  cast.sort(function (p, q) { return p[0].y - q[0].y; });
  for (i = 0; i < cast.length; i++) render(cast[i][0], cast[i][1], now, cast[i][2], cast[i][3]);

  // Stars where the pig got flattened.
  if (!alive && dying < 1) {
    var cx = px(A.pig.x), cy = py(A.pig.y);
    for (var pass = 0; pass < 2; pass++) {
      ctx.strokeStyle = pass ? '#000' : '#fff'; ctx.lineWidth = cell * (pass ? 0.035 : 0.075);
      ctx.globalAlpha = 1 - dying;
      for (i = 0; i < 8; i++) {
        var ang = i / 8 * 6.2832 + 0.3, r1 = cell * (0.2 + dying * 0.3), r2 = cell * (0.32 + dying * 0.42);
        line(cx + Math.cos(ang) * r1, cy + Math.sin(ang) * r1, cx + Math.cos(ang) * r2, cy + Math.sin(ang) * r2);
      }
    }
    ctx.globalAlpha = 1;
  }
}

// ---------- Input ----------

function step(dx, dy) {
  if (!G.lv) return;
  var x = colOf(G.bun) + dx, y = rowOf(G.bun) + dy;
  if (x < 0 || y < 0 || x >= G.lv.w || y >= G.lv.h) return;
  tryMove(y * G.lv.w + x);
}

var down = null;
canvas.addEventListener('pointerdown', function (e) { down = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointercancel', function () { down = null; });
canvas.addEventListener('pointerup', function (e) {
  if (!down) return;
  var dx = e.clientX - down.x, dy = e.clientY - down.y; down = null;
  if (Math.hypot(dx, dy) >= 24) {
    if (Math.abs(dx) > Math.abs(dy)) step(dx > 0 ? 1 : -1, 0); else step(0, dy > 0 ? 1 : -1);
    return;
  }
  var box = canvas.getBoundingClientRect();
  var cx = Math.floor((e.clientX - box.left - ox) / cell), cy = Math.floor((e.clientY - box.top - oy) / cell);
  if (cx < 0 || cy < 0 || cx >= G.lv.w || cy >= G.lv.h) return;
  tryMove(cy * G.lv.w + cx);
});

window.addEventListener('keydown', function (e) {
  if (!sheet.hidden) return;
  var k = e.key.toLowerCase();
  if (k === 'arrowup' || k === 'w') step(0, -1);
  else if (k === 'arrowdown' || k === 's') step(0, 1);
  else if (k === 'arrowleft' || k === 'a') step(-1, 0);
  else if (k === 'arrowright' || k === 'd') step(1, 0);
  else if (k === 'z') undo();
  else if (k === 'r') loadLevel(G.n);
  else return;
  e.preventDefault();
});

$('prev').addEventListener('click', function () { if (G.n > 1) loadLevel(G.n - 1); });
$('next').addEventListener('click', function () { if (G.n < store.max) loadLevel(G.n + 1); });
$('help').addEventListener('click', showHelp);
$('sound').addEventListener('click', function () {
  store.sound = !store.sound; save(); soundButton();
  if (store.sound) audioOn(); else audioOff();
});
['pointerup', 'touchend', 'click', 'keydown'].forEach(function (ev) {
  document.addEventListener(ev, audioOn, { passive: true });
});
document.addEventListener('visibilitychange', function () {
  if (document.hidden) audioOff(); else { if (ac) audioOn(); kick(); }
});
$('undo').addEventListener('click', undo);
$('reset').addEventListener('click', function () { loadLevel(G.n); });
$('hint').addEventListener('click', hint);

if (window.ResizeObserver) new ResizeObserver(function () { layout(); draw(); }).observe(stage);
else window.addEventListener('resize', function () { layout(); draw(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { paintBoard(); draw(); });

// ---------- Boot ----------

function start(data) {
  document.documentElement.lang = 'es';
  var n = data && data.n ? data.n : Math.min(Math.max(store.cur, 1), store.max);
  soundButton();
  loadLevel(n, data);
  kick();
}
var hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) {
  hot.snapshot(function () {
    var won = G.status === 'won', h = G.hist.slice(), bun = G.bun, pig = G.pig, pan = G.pan, moves = G.moves;
    if (G.status === 'lost' && h.length) { var last = h.pop(); bun = last[0]; pig = last[1]; pan = last[2]; moves--; }
    return won ? { n: G.n + 1 } : { n: G.n, bun: bun, pig: pig, pan: pan, moves: moves, hist: h };
  });
}
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
